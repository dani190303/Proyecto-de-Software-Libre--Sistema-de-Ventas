<nav *ngIf="authService.user$ | async as user"
    style="display: flex; gap: 10px; align-items: center; padding: 10px; background: #eee;">
    <h1 style="margin: 0; margin-right: 20px;">POS System</h1>
    <a routerLink="/ventas">Ventas</a> |
    <a routerLink="/historial">Historial</a> |
    <a routerLink="/productos">Productos</a> |
    <a routerLink="/clientes">Clientes</a> |
    <a routerLink="/usuarios">Usuarios</a> |
    <a routerLink="/categorias">Categorías</a>

    <span style="flex: 1;"></span>
    <span>Hola, {{ user.nombres }}</span>
    <button (click)="logout()"
        style="padding: 5px 10px; background: #d32f2f; color: white; border: none; border-radius: 4px; cursor: pointer;">Salir</button>
</nav>
